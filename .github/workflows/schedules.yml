# Collects MKL and RKL game schedules every night and saves them to data/schedules.json.
name: Update schedules

on:
  schedule:
    - cron: "17 2 * * *"   # every night at ~04:17 Lithuanian time
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/schedules.yml"]

permissions:
  contents: write

concurrency:
  group: schedules
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Collect schedules
        run: node scripts/fetch-schedules.mjs
      - name: Save results
        run: |
          git config user.name "schedule-robot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update schedules" && git push)
